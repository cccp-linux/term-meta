[colors.primary]
background = "#152528"
foreground = "#e6eaea"

[font]
normal.family = "Courier Nerd Font"
size = 16

[keyboard]
bindings = [
   { key = "n", mods = "Control|Shift", action = "SpawnNewInstance" }
]

[mouse]
hide_when_typing = true

[scrolling]
history = 100000

[window]
opacity = 0.90
